<!doctype html>
<html><head><meta charset="utf-8"><title>Three Doors</title>
<style>
@font-face { font-family: "Inter Display"; font-weight: 700; src: url("file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf"); }
@font-face { font-family: "Inter"; font-weight: 500; src: url("file:///usr/share/fonts/opentype/inter/Inter-Medium.otf"); }
@font-face { font-family: "Inter"; font-weight: 400; src: url("file:///usr/share/fonts/opentype/inter/Inter-Regular.otf"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("file:///usr/share/fonts/truetype/jetbrains-mono/JetBrainsMono-Medium.ttf"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("file:///usr/share/fonts/truetype/jetbrains-mono/JetBrainsMono-Bold.ttf"); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style>
<script src="layout.js"></script>
</head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
/* Three Doors: render(frame). Draws what ThreeDoors.layout(frame) returns.
   Order: background and nebula; the doors (opening, prize, panel, frame halo, frame ink); the text's glow,
   then its ink; the vignette. Glyph halos are baked once per (text, face, size, colour, variant) into
   offscreen sprites and blitted as light ('lighter'); ink is drawn crisp with fillText on top. Door halos
   are baked once per base colour (lavender, cyan, mist) and mixed as light by weight.
   No requestAnimationFrame, Date or Math.random: the frame number is the only input. */
const TD = window.ThreeDoors;
let S = null, BASE = 1;
const W = 1080, H = 1920;
const main = document.getElementById('c');
const ctx = main.getContext('2d', { alpha: false });
const meas = document.createElement('canvas').getContext('2d');
let REST = 0.5, PEAK = 1.2;

function measureRaw(text, font) {
  meas.font = font;
  const m = meas.measureText(text);
  return { width: m.width, left: m.actualBoundingBoxLeft, right: m.actualBoundingBoxRight,
           ascent: m.actualBoundingBoxAscent, descent: m.actualBoundingBoxDescent };
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rgba(h, a) { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);

// ---------------------------------------------------------------------------------------- fonts
window.ready = async function () {
  const faces = ['700 56px "Inter Display"', '500 38px "Inter"', '400 34px "Inter"', '500 48px "JetBrains Mono"', '700 88px "JetBrains Mono"'];
  for (const f of faces) {
    const r = await document.fonts.load(f);
    if (!r.length) throw new Error('font not loaded: ' + f);
  }
  await document.fonts.ready;
  return {
    mono0_100: measureRaw('0', '500 100px "JetBrains Mono"').width,
    monoB0_100: measureRaw('0', '700 100px "JetBrains Mono"').width,
    target56: measureRaw('Switch or stay?', '700 56px "Inter Display"').width,
    hook3_56: measureRaw('The host opens an empty one.', '700 56px "Inter Display"').width,
    rule2b_38: measureRaw('an empty door that is not yours.', '500 38px "Inter"').width,
    interRegular34_x: measureRaw('x', '400 34px "Inter"').width,
  };
};

window.setup = function (story, scale) {
  S = story; BASE = scale || 1;
  main.width = Math.round(W * BASE); main.height = Math.round(H * BASE);
  REST = S.meta.stamp_bloom.rest_glow; PEAK = S.meta.stamp_bloom.peak_glow;
  TD.init(S, measureRaw);
  sprites.clear(); doorSprites.clear(); prizeSprites.clear();
  return { width: main.width, height: main.height };
};

// -------------------------------------------------------------------------------------- sprites
const PAD = 64;
const sprites = new Map(), doorSprites = new Map(), prizeSprites = new Map();
const BLOOM_STROKE = 2.5;

/* The halo: two blurred copies of the source, added as light. The rest halo is tight (7 px) with a wide
   faint skirt (26 px); the bloom is wider and softer (12 / 30 px) so a stamp reads as a flash of light
   around the glyph, not as a thicker glyph. */
function bakeGlow(cw, ch, drawSrc, bloom, res) {
  res = res || 1;
  const src = mk(cw, ch);
  drawSrc(src.getContext('2d'));
  const out = mk(cw, ch), o = out.getContext('2d');
  o.globalCompositeOperation = 'lighter';
  o.filter = `blur(${(bloom ? 12 : 7) * res}px)`; o.globalAlpha = bloom ? 0.5 : 0.55; o.drawImage(src, 0, 0);
  o.filter = `blur(${(bloom ? 30 : 26) * res}px)`; o.globalAlpha = bloom ? 0.6 : 0.5; o.drawImage(src, 0, 0);
  o.filter = 'none'; o.globalAlpha = 1;
  return out;
}

/* The halo of one run of text, baked at half resolution; the ink is drawn separately with fillText. */
const SPR = 0.5;
function glyphSprite(text, faceKey, size, colourHex, variant) {
  const key = faceKey + '|' + size + '|' + colourHex + '|' + variant + '|' + text;
  let sp = sprites.get(key);
  if (sp) return sp;
  const bs = size * SPR, pad = PAD * SPR;
  const font = TD.fontOf(faceKey, bs);
  const m = measureRaw(text, font);
  const ox = pad + Math.max(0, Math.ceil(m.left));
  const cw = ox + Math.ceil(Math.max(m.right, m.width)) + pad;
  const oy = pad + Math.ceil(m.ascent);
  const ch = oy + Math.ceil(m.descent) + pad;
  const bloom = variant === 'bloom';
  const canvas = bakeGlow(cw, ch, c => {
    c.font = font; c.fillStyle = colourHex; c.strokeStyle = colourHex; c.lineJoin = 'round'; c.textBaseline = 'alphabetic';
    c.lineWidth = Math.max(1.5 * SPR, bs * (bloom ? 0.07 * BLOOM_STROKE : 0.07));
    c.globalAlpha = bloom ? 1 : REST;
    c.fillText(text, ox, oy); c.strokeText(text, ox, oy);
  }, bloom, SPR);
  sp = { canvas, ox, oy, scale: 1 / SPR };
  sprites.set(key, sp);
  return sp;
}

function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* A door frame's halo in one base colour, rest or bloom; the frame is the same size for every door. */
function doorSprite(colourHex, variant) {
  const key = colourHex + '|' + variant;
  let sp = doorSprites.get(key);
  if (sp) return sp;
  const G = S.geometry.doors, bloom = variant === 'bloom';
  const canvas = bakeGlow(G.w + 2 * PAD, G.h + 2 * PAD, c => {
    c.strokeStyle = colourHex; c.lineWidth = bloom ? 10 : 4; c.globalAlpha = bloom ? 1 : 0.45;
    rrect(c, PAD, PAD, G.w, G.h, G.radius); c.stroke();
  }, bloom);
  sp = { canvas, ox: PAD, oy: PAD };
  doorSprites.set(key, sp);
  return sp;
}
/* The prize's halo: a point of light with a wide soft skirt. */
function prizeSprite(variant) {
  let sp = prizeSprites.get(variant);
  if (sp) return sp;
  const P = S.geometry.prize, amber = S.meta.colours.amber, bloom = variant === 'bloom';
  const R = P.halo + PAD, size = 2 * R;
  const canvas = mk(size, size), c = canvas.getContext('2d');
  const g = c.createRadialGradient(R, R, 0, R, R, P.halo * (bloom ? 1.25 : 1));
  g.addColorStop(0, rgba(amber, bloom ? 0.95 : 0.8)); g.addColorStop(0.18, rgba(amber, bloom ? 0.55 : 0.32));
  g.addColorStop(0.5, rgba(amber, bloom ? 0.16 : 0.08)); g.addColorStop(1, rgba(amber, 0));
  c.fillStyle = g; c.fillRect(0, 0, size, size);
  sp = { canvas, ox: R, oy: R };
  prizeSprites.set(variant, sp);
  return sp;
}

// --------------------------------------------------------------------------------------- drawing
function blit(sp, x, baseline, k, alpha) {
  if (alpha <= 0) return;
  ctx.globalAlpha = alpha;
  if (sp.scale) k *= sp.scale;
  if (k === 1) ctx.drawImage(sp.canvas, x - sp.ox, baseline - sp.oy);
  else ctx.drawImage(sp.canvas, x - sp.ox * k, baseline - sp.oy * k, sp.canvas.width * k, sp.canvas.height * k);
}
/* glow g -> [rest weight, bloom weight]: the bloom replaces the rest halo as g rises from 0.5 to 1.2 */
const weights = (g, base) => { const b = clamp01((g - REST) / (PEAK - REST)); return [Math.min(g, REST) / REST * (1 - b) * base, b * base]; };

function drawTextGlow(it) {
  const k = it.size / it.bakeSize;
  for (const r of it.runs) {
    const g = r.glow == null ? it.glow : r.glow;
    const [restW, bloomW] = weights(g, it.alpha * (r.alpha == null ? 1 : r.alpha));
    if (restW <= 0 && bloomW <= 0) continue;
    if (restW > 0) blit(glyphSprite(r.text, it.face, it.bakeSize, r.colour, 'rest'), r.x, it.baseline, k, restW);
    if (bloomW > 0) blit(glyphSprite(r.text, it.face, it.bakeSize, r.colour, 'bloom'), r.x, it.baseline, k, bloomW);
  }
}
let lastFont = null;
function drawTextInk(it) {
  if (!it.ink) return;
  const font = TD.fontOf(it.face, it.size);
  if (font !== lastFont) { ctx.font = font; lastFont = font; }
  for (const r of it.runs) {
    ctx.fillStyle = r.colour;
    ctx.globalAlpha = it.alpha * (r.alpha == null ? 1 : r.alpha);
    ctx.fillText(r.text, r.x, it.baseline);
  }
}

/* A door: the opening behind the panel, the prize inside it, the panel (slid up by `open`), the frame's
   halo as light, then the frame's ink. */
function drawDoor(d) {
  const G = S.geometry.doors, C = S.meta.colours;
  const inset = G.panel_inset, ix = d.x + inset, iy = d.y + inset, iw = d.w - 2 * inset, ih = d.h - 2 * inset;
  const ir = Math.max(2, d.radius - inset * 0.6);
  // the opening: a little darker than the sky, so an open door reads as a dark room
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = d.alpha;
  rrect(ctx, ix, iy, iw, ih, ir); ctx.fillStyle = '#04030E'; ctx.fill();
  // the prize, clipped to the opening
  if (d.prize && d.prize.alpha > 0) {
    ctx.save(); rrect(ctx, ix, iy, iw, ih, ir); ctx.clip();
    const cx = d.x + d.w / 2, cy = d.y + d.h / 2, P = S.geometry.prize;
    ctx.globalCompositeOperation = 'lighter';
    const [rw, bw] = weights(d.prize.glow, d.prize.alpha * d.alpha);
    if (rw > 0) { const sp = prizeSprite('rest'); ctx.globalAlpha = rw; ctx.drawImage(sp.canvas, cx - sp.ox, cy - sp.oy); }
    if (bw > 0) { const sp = prizeSprite('bloom'); ctx.globalAlpha = bw; ctx.drawImage(sp.canvas, cx - sp.ox, cy - sp.oy); }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = d.prize.alpha * d.alpha;
    ctx.beginPath(); ctx.arc(cx, cy, P.radius, 0, Math.PI * 2); ctx.fillStyle = C.starlight; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, P.radius * 1.9, 0, Math.PI * 2); ctx.fillStyle = rgba(C.amber, 0.35); ctx.fill();
    ctx.restore();
  }
  // the panel: a faint lit sheet with a thin inner line, sliding up as the door opens
  if (d.open < 1) {
    ctx.save(); rrect(ctx, ix, iy, iw, ih, ir); ctx.clip();
    const dy = -d.open * (ih + 4);
    const pa = (1 - 0.5 * d.open) * d.alpha;
    ctx.globalAlpha = pa;
    rrect(ctx, ix, iy + dy, iw, ih, ir); ctx.fillStyle = TD.mixHex(C.bg, d.colour, 0.10); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(d.colour, 0.35);
    rrect(ctx, ix + 10, iy + dy + 10, iw - 20, ih - 20, Math.max(1, ir - 6)); ctx.stroke();
    ctx.restore();
  }
  // the frame's halo: the base halos mixed as light by the door's colour weights
  ctx.globalCompositeOperation = 'lighter';
  const [restW, bloomW] = weights(d.glow, d.alpha);
  const mixes = [[C.lavender, (1 - d.pick) * (1 - d.dim * 0.8)], [C.cyan, d.pick * (1 - d.dim * 0.8)], [C.mist, d.dim * 0.8]];
  for (const [col, wgt] of mixes) {
    if (wgt <= 0.01) continue;
    if (restW > 0) { const sp = doorSprite(col, 'rest'); ctx.globalAlpha = restW * wgt; ctx.drawImage(sp.canvas, d.x - sp.ox, d.y - sp.oy); }
    if (bloomW > 0) { const sp = doorSprite(col, 'bloom'); ctx.globalAlpha = bloomW * wgt; ctx.drawImage(sp.canvas, d.x - sp.ox, d.y - sp.oy); }
  }
  // the frame's ink
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = d.alpha;
  ctx.lineWidth = G.frame_lw; ctx.strokeStyle = d.colour;
  rrect(ctx, d.x, d.y, d.w, d.h, d.radius); ctx.stroke();
}

function render(f) {
  const L = TD.layout(f);
  const b = BASE;
  lastFont = null;
  ctx.setTransform(b, 0, 0, b, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.imageSmoothingEnabled = true;
  ctx.fillStyle = S.meta.colours.bg; ctx.fillRect(0, 0, W, H);
  // the nebula
  const nb = S.geometry.nebula;
  ctx.globalCompositeOperation = 'lighter';
  const grd = ctx.createRadialGradient(nb.centre[0], nb.centre[1], 0, nb.centre[0], nb.centre[1], nb.radius);
  grd.addColorStop(0, rgba(L.nebula, nb.peak)); grd.addColorStop(0.45, rgba(L.nebula, nb.peak * 0.45)); grd.addColorStop(1, rgba(L.nebula, 0));
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  const items = L.items;
  for (const it of items) if (it.kind === 'door') drawDoor(it);
  ctx.globalCompositeOperation = 'lighter';
  for (const it of items) if (it.kind === 'text') drawTextGlow(it);
  ctx.globalCompositeOperation = 'source-over';
  for (const it of items) if (it.kind === 'text') drawTextInk(it);
  // the vignette
  ctx.globalAlpha = 1;
  const v = ctx.createRadialGradient(540, 960, 560, 540, 960, 1320);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.26)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  return L;
}

// ------------------------------------------------------------------------------------- the API
window.renderFrame = function (f) { const t0 = performance.now(); render(f); return performance.now() - t0; };
window.frameDataURL = function (f) {
  const drawMs = window.renderFrame(f);
  const t0 = performance.now();
  const url = main.toDataURL('image/png');
  return { url, drawMs, encMs: performance.now() - t0 };
};
window.timeFrame = function (f, n) {
  const draw = [], enc = [];
  for (let i = 0; i < n; i++) {
    const t0 = performance.now();
    render(f); ctx.getImageData(0, 0, 1, 1);
    const t1 = performance.now();
    main.toDataURL('image/png');
    const t2 = performance.now();
    draw.push(t1 - t0); enc.push(t2 - t1);
  }
  const med = a => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };
  return { frame: f, n, draw_ms_median: Math.round(med(draw) * 100) / 100, enc_ms_median: Math.round(med(enc) * 100) / 100,
           draw_ms_min: Math.round(Math.min(...draw) * 100) / 100, enc_ms_min: Math.round(Math.min(...enc) * 100) / 100, sprites: sprites.size };
};
window.layoutAt = f => TD.layout(f);
window.checkFrames = () => TD.checkFrames();
window.runCheck = opts => TD.check(opts);
window.stillList = () => TD.STILLS;
window.spriteCount = () => sprites.size;

// stills and the contact sheet
let sheet = null, sheetCtx = null, sheetCols = 6, tileW = 270, tileH = 480, capH = 34, margin = 12;
window.captureStill = function (f) {
  render(f);
  const full = main.toDataURL('image/png');
  const sm = mk(360, 640), sc = sm.getContext('2d');
  sc.imageSmoothingEnabled = true; sc.imageSmoothingQuality = 'high';
  sc.drawImage(main, 0, 0, 360, 640);
  return { full, small: sm.toDataURL('image/png') };
};
window.sheetInit = function (n, cols) {
  sheetCols = cols || 6;
  const rows = Math.ceil(n / sheetCols);
  sheet = mk(sheetCols * tileW + (sheetCols + 1) * margin, rows * (tileH + capH + margin) + margin);
  sheetCtx = sheet.getContext('2d');
  sheetCtx.fillStyle = '#000'; sheetCtx.fillRect(0, 0, sheet.width, sheet.height);
  sheetCtx.imageSmoothingEnabled = true; sheetCtx.imageSmoothingQuality = 'high';
  return { width: sheet.width, height: sheet.height };
};
window.sheetAdd = function (i, caption) {
  const col = i % sheetCols, row = Math.floor(i / sheetCols);
  const x = margin + col * (tileW + margin), y = margin + row * (tileH + capH + margin);
  sheetCtx.drawImage(main, x, y, tileW, tileH);
  sheetCtx.save();
  sheetCtx.beginPath(); sheetCtx.rect(x, y + tileH, tileW, capH); sheetCtx.clip();
  sheetCtx.fillStyle = '#C9D1E6'; sheetCtx.font = '500 16px "Inter"'; sheetCtx.textBaseline = 'alphabetic';
  sheetCtx.fillText(caption, x, y + tileH + 22);
  sheetCtx.restore();
  return true;
};
window.sheetDataURL = () => sheet.toDataURL('image/png');
</script>
</body></html>
